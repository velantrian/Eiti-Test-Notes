name: PR79 one-shot composer audit patch
on:
  push:
    branches:
      - audit/pr79-composer-regression-20261102
    paths:
      - .github/workflows/pr79-one-shot-patch.yml

permissions:
  contents: write

jobs:
  apply-audited-patch:
    if: github.repository == 'velantrian/Eiti-Test-Notes' && github.ref == 'refs/heads/audit/pr79-composer-regression-20261102'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact source and apply previously reviewed patch (audit branch only)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:index.html)" = "f777ba225bebf3cd835c6bc8a19c4ed4014650c8"
          git apply --check docs/pr79_composer_regression_fix.patch
          git apply docs/pr79_composer_regression_fix.patch
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          assert 'var EITI_VERSION = "14.16.10"' in html
          assert "window.eitiComposerUndoCheckpoint = function" in html
          assert html.count("window.eitiComposerUndoCheckpoint();") == 2
          assert "window.eitiShowOfflineTyping = function" in html
          assert "window.eitiWithOfflineTyping = function" in html
          assert "role=\"switch\" aria-checked=\"" in html
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "fix: preserve composer drafts on clear and keep toggle independent"
          git push origin HEAD:refs/heads/audit/pr79-composer-regression-20261102
