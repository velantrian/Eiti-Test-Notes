name: Temporary memory safety patch (PR 46 only)
on:
  push:
    branches: [feature/respect-dont-remember]
    paths: [.github/workflows/oneoff-memory-guard.yml]
permissions:
  contents: write
jobs:
  apply-once:
    if: github.repository == 'velantrian/Eiti-Test-Notes' && github.ref == 'refs/heads/feature/respect-dont-remember'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/respect-dont-remember
          fetch-depth: 2
      - name: Fail-closed memory patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf8')
          def patch(a,b):
              global s
              n=s.count(a)
              assert n==1, f'exact-match guard failed: {a[:80]} found {n} times'
              s=s.replace(a,b,1)
          patch("            if (typeof showToast === 'function') showToast('⚠️ Память была повреждена — сохранил копию (' + (ok ? bk : 'не удалось') + ') и начал новый список', 5000);",
                "            if (!ok) { if (typeof showToast === 'function') showToast('⚠️ Не удалось сохранить резервную копию — исходные данные не перезаписаны', 7000); throw new Error('EITI_CORRUPT_BACKUP_FAILED: ' + key); }\n            if (typeof showToast === 'function') showToast('⚠️ Память была повреждена — исходные данные зарезервированы (' + bk + ')', 5000);")
          patch("                        var L = eitiReadListSafe('eiti_learned_v1'), A = eitiReadListSafe('eiti_learned_archive_v1'), now = Date.now();",
                "                        var L, A, now = Date.now();\n                        try { L = eitiReadListSafe('eiti_learned_v1'); A = eitiReadListSafe('eiti_learned_archive_v1'); }\n                        catch (e) { console.warn('[EITI] миграция памяти заблокирована: резерв не создан', e); resolve(false); return; }")
          patch("            if (typeof eitiLearnLoad === 'function') return eitiLearnLoad('learned').filter(function(f){ return f && !f.superseded_by; }); // IDB memkv",
                "            if (typeof eitiLearnLoad === 'function') { try { return eitiLearnLoad('learned').filter(function(f){ return f && !f.superseded_by; }); } catch (e) { console.warn('[EITI] чтение памяти заблокировано:', e); return []; } } // IDB memkv")
          patch("                    if (window.EITI_DEBUG) console.log('[L3] Сохранён факт:', label, '=', value.trim());",
                "                    if (window.EITI_DEBUG) console.log('[L3] Сохранён факт:', label, '=', value.trim());\n                    if (_l3Pending.length && typeof window.eitiL3FlushPending === 'function') window.eitiL3FlushPending();")
          patch("                    if (ev && ev.preventDefault) ev.preventDefault();\n                    if (tx._eitiReported) return; tx._eitiReported = true;\n                    var er = tx.error || (ev && ev.target && ev.target.error);\n                    console.warn('[L3] Ошибка сохранения:', er);",
                "                    if (tx._eitiReported) return; tx._eitiReported = true;\n                    _l3Pending.push([key, value, label, source, reason]);\n                    var er = tx.error || (ev && ev.target && ev.target.error);\n                    console.warn('[L3] Ошибка сохранения, факт возвращён в очередь:', er);")
          patch("'⚠️ Память браузера заполнена — факт «' + label + '» не сохранён' : '⚠️ Не удалось сохранить факт «' + label + '»', 4000);",
                "'⚠️ Память браузера заполнена — факт «' + label + '» ждёт повтора, не закрывайте вкладку' : '⚠️ Факт «' + label + '» ждёт повтора, не закрывайте вкладку', 7000);")
          patch("            } catch(e) { console.warn('[L3] Ошибка сохранения:', e); if (typeof showToast === 'function') showToast('⚠️ Не удалось сохранить факт «' + label + '»', 4000); }",
                "            } catch(e) { _l3Pending.push([key, value, label, source, reason]); console.warn('[L3] Факт возвращён в очередь:', e); if (typeof showToast === 'function') showToast('⚠️ Факт «' + label + '» ждёт повтора, не закрывайте вкладку', 7000); }")
          p.write_text(s,encoding='utf8')
          print('index.html patch completed')
          PY
          git diff --check
          node --test velantrim_core/tests_js/l3_memory_contract.test.js velantrim_core/tests_js/learn_fact.test.js
      - name: Commit patch to PR head (no merge)
        shell: bash
        run: |
          test "$(git branch --show-current)" = 'feature/respect-dont-remember'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m 'fix(memory): preserve corrupt sources on failed backup and retain L3 on IDB failures'
          git push origin HEAD:feature/respect-dont-remember
